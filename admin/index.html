<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容管理 · aszz007</title><meta name="robots" content="noindex"><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head>
<body><header><a href="../">aszz007</a><span>内容管理</span><a href="../" target="_blank" rel="noopener">查看公开页面</a></header>
<main>
  <section id="login-panel" class="login"><h1>内容管理登录</h1><p>登录后可修改个人介绍与作品。</p><form id="login-form"><label for="password">管理员密码</label><input id="password" type="password" required autocomplete="current-password" maxlength="200"><button type="submit" id="login-button">登录</button></form></section>
  <section id="editor" hidden><div class="editor-title"><div><h1>网站内容</h1></div><button type="button" id="logout" class="quiet">退出登录</button></div>
    <form id="content-form">
      <section class="profile-section"><h2>个人信息</h2><div class="fields"><label>昵称<input name="name" required maxlength="40"></label><label>GitHub地址<input name="githubUrl" type="url" maxlength="500"></label><label class="wide">首页标题<textarea name="headline" required maxlength="80" rows="2"></textarea></label><label class="wide">个人简介<textarea name="introduction" required maxlength="400" rows="3"></textarea></label><label class="wide">关于我<textarea name="about" required maxlength="600" rows="3"></textarea></label><label class="wide">关注方向<input name="focus" required maxlength="120"></label></div></section>
      <section class="project-section"><div class="section-title"><h2>作品内容</h2><button type="button" id="add-project" class="secondary">新增作品</button></div><div class="project-layout"><nav id="project-list" aria-label="选择要编辑的作品"></nav><div id="project-editor"><div class="fields"><label>项目标识<input name="p-id" required maxlength="50" pattern="[a-z0-9-]+"></label><label>分类<select name="p-category"><option value="research">科研项目</option><option value="course">课程作品</option></select></label><label>名称<input name="p-title" required maxlength="80"></label><label>状态<input name="p-state" required maxlength="80"></label><label class="wide">副标题<input name="p-subtitle" required maxlength="120"></label><label class="wide">摘要<textarea name="p-summary" required maxlength="600" rows="3"></textarea></label><label class="wide">详细说明<textarea name="p-description" required maxlength="2000" rows="4"></textarea></label><label>源码地址<input name="p-sourceUrl" type="url" maxlength="500"></label><label>作品地址<input name="p-liveUrl" type="url" maxlength="500"></label><label class="wide">技术标签（每行一个，最多8个）<textarea name="p-tags" rows="3"></textarea></label><label class="wide">功能说明（每行一项，最多10项）<textarea name="p-points" rows="5"></textarea></label><label class="wide">项目说明<textarea name="p-status" required maxlength="1000" rows="3"></textarea></label><label>配图<select name="p-art"><option value="inst">需求到说明</option><option value="web">网页原型</option><option value="todo">待办</option><option value="portfolio">作品集</option><option value="notes">笔记</option><option value="weather">天气</option><option value="imagegrab">图片工具</option></select></label></div><button type="button" id="delete-project" class="danger">移除此作品</button></div></div></section>
      <div class="save-bar"><span id="save-state">尚无修改</span><button type="button" id="reload" class="secondary">重新加载</button><button type="submit" id="save">保存网站内容</button></div>
    </form>
  </section>
  <p id="message" role="status" aria-live="polite"></p>
</main></body></html>
